{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto flex flex-wrap p-6 pt-12">
    <div class="w-full bg-white p-6 sm:p-8 rounded-2xl border border-slate-200 shadow-xl">
        <p class="text-sm uppercase tracking-wider text-red-600 font-semibold mb-2">Welcome back</p>
        <h1 class="mb-6 text-3xl font-extrabold text-slate-800">
            Log In
        </h1>
        <form action="{% url 'login' %}" method="post" class="space-y-3">
            {% csrf_token %}
            <div>
                <label class="text-sm font-medium text-slate-700">Email/Username</label>
                <input type="text" name="username_or_email" class="w-full mt-2 py-3 px-4 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-red-400">
            </div>
            <div>
                <label class="text-sm font-medium text-slate-700">Password</label>
                <input type="password" name="password" class="w-full mt-2 py-3 px-4 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-red-400">
            </div>
        
            <button class="w-full py-3 rounded-xl px-6 text-white font-semibold bg-red-600 hover:bg-red-700 transition">Sign In</button>
        </form>
          
    </div>
</div>
{% endblock %}

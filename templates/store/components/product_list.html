<article class="group rounded-2xl bg-white border border-slate-200 shadow-sm hover:shadow-2xl hover:-translate-y-1 transition-all duration-300 overflow-hidden flex flex-col h-full">
    <!-- Image Container with Zoom Effect -->
    <a href="{% url 'product_detail' product.slug %}" class="block relative overflow-hidden bg-gradient-to-br from-slate-50 to-slate-100 flex-shrink-0">
        <img src="{{ product.get_image_url }}" alt="{{ product.name }}" class="w-full h-64 object-contain p-4 group-hover:scale-110 transition-transform duration-300">
        
        <!-- Stock Badge -->
        <div class="absolute top-3 right-3 z-10">
            {% if product.is_available %}
            <span class="inline-block bg-green-500 text-white text-xs font-bold px-2 py-1 rounded-full">In Stock</span>
            {% else %}
            <span class="inline-block bg-slate-400 text-white text-xs font-bold px-2 py-1 rounded-full">Sold Out</span>
            {% endif %}
        </div>
    </a>

    <!-- Content Container -->
    <div class="p-4 flex-grow flex flex-col">
        <!-- Category -->
        <p class="text-xs uppercase tracking-wide text-red-600 font-semibold">{{ product.category.name }}</p>
        
        <!-- Product Name -->
        <a href="{% url 'product_detail' product.slug %}" class="block mt-2 text-base font-bold text-slate-800 hover:text-red-600 transition line-clamp-2 flex-grow">
            {{ product.name }}
        </a>

        <!-- Rating Stars -->
        <div class="mt-2 flex items-center gap-1">
            <div class="flex text-yellow-400">
                <span class="text-sm">★★★★★</span>
            </div>
            <span class="text-xs text-slate-500 ml-1">(42)</span>
        </div>

        <!-- Price & Action -->
        <div class="mt-4 pt-4 border-t border-slate-100 flex items-center justify-between">
            <p class="text-lg font-extrabold text-slate-800">${{ product.get_display_price }}</p>
            <button class="inline-flex items-center justify-center h-10 w-10 rounded-lg bg-red-600 text-white hover:bg-red-700 transition-all duration-200 shadow-md hover:shadow-lg hover:scale-110 group/btn" aria-label="Add to cart">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 group-hover/btn:scale-125 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
            </button>
        </div>
    </div>
</article>
